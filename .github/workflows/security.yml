name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule: [{ cron: "0 3 * * 1" }]
permissions: { contents: read, security-events: write }

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GITLEAKS_CONFIG: .gitleaks.toml }

  forbidden-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_forbidden_providers.sh

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - working-directory: apps/api
        run: uv export --frozen --no-dev --no-hashes > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    strategy: { matrix: { language: [python, javascript-typescript] } }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@v3
