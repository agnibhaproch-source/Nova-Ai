name: deploy
# Single-server deploy (infra/deploy, docs/47 §1b). Images → GHCR tagged with the git sha,
# then SSH to the host: pull, migrate, restart, smoke. Production requires manual approval
# via the GitHub Environment "production".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment: { description: "staging or production", required: true, default: staging }
concurrency: { group: "deploy-${{ github.ref }}", cancel-in-progress: false }
permissions: { contents: read, packages: write }

jobs:
  images:
    runs-on: ubuntu-latest
    outputs: { tag: "${{ steps.t.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - name: build and push
        env: { R: "ghcr.io/${{ github.repository_owner }}", T: "${{ steps.t.outputs.tag }}" }
        run: |
          R=$(echo "$R" | tr '[:upper:]' '[:lower:]')
          docker buildx build --push --target prod -t $R/nova-api:$T apps/api
          docker buildx build --push --target prod -f apps/web/Dockerfile -t $R/nova-web:$T .
          docker buildx build --push -t $R/nova-sandbox-runner:$T apps/sandbox-runner
          docker buildx build --push -t $R/nova-sandbox-python:$T infra/docker/sandbox-python

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: "${{ github.event.inputs.environment || 'production' }}"
    steps:
      - uses: actions/checkout@v4
      - name: copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "${{ secrets.DEPLOY_HOST }}"
          username: "${{ secrets.DEPLOY_USER }}"
          key: "${{ secrets.DEPLOY_SSH_KEY }}"
          source: "infra/deploy/docker-compose.prod.yml,infra/deploy/Caddyfile,infra/deploy/backup.sh,infra/deploy/restore.sh,infra/deploy/storage-init.sh,infra/docker/postgres/init"
          target: "/opt/nova"
      - name: pull, migrate, restart
        uses: appleboy/ssh-action@v1.0.3
        env: { TAG: "${{ needs.images.outputs.tag }}" }
        with:
          host: "${{ secrets.DEPLOY_HOST }}"
          username: "${{ secrets.DEPLOY_USER }}"
          key: "${{ secrets.DEPLOY_SSH_KEY }}"
          envs: TAG
          script: |
            set -euo pipefail
            cd /opt/nova/infra/deploy
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/" .env.production
            PREV=$(docker compose -f docker-compose.prod.yml --env-file .env.production images -q api | head -1 || true)
            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
            echo "previous api image: $PREV"
      - name: smoke
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.DEPLOY_DOMAIN }}/api/v1/app-config") && [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "smoke failed"; exit 1
