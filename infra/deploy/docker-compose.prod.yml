# Single-server production stack (docs/47 §1b): Caddy (auto-HTTPS) → web → api; worker; Postgres,
# Redis, MinIO on the same host. Images come from CI (deploy.yml) tagged with the git sha.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
name: nova-prod

x-app-env: &app-env
  env_file: .env.production
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://nova:${POSTGRES_PASSWORD:?}@postgres:5432/nova
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: https://files.${DOMAIN:?}${PUBLIC_PORT_SUFFIX:-}
    APP_URL: https://${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment: { DOMAIN: "${DOMAIN}", CADDY_TLS: "${CADDY_TLS:?set to your email, or 'internal' for local tests}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [web, minio]
    restart: unless-stopped

  web:
    image: ${REGISTRY:-nova}/nova-web:${IMAGE_TAG:-dev}
    env_file: .env.production
    environment:
      API_INTERNAL_URL: http://api:8000
      APP_URL: https://${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      S3_PUBLIC_ENDPOINT: https://files.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      APP_ENV: production
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

  migrate:
    <<: *app-env
    image: ${REGISTRY:-nova}/nova-api:${IMAGE_TAG:-dev}
    command: ["alembic", "upgrade", "head"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    <<: *app-env
    image: ${REGISTRY:-nova}/nova-api:${IMAGE_TAG:-dev}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    <<: *app-env
    image: ${REGISTRY:-nova}/nova-api:${IMAGE_TAG:-dev}
    command: ["arq", "app.workers.settings.WorkerSettings"]
    healthcheck: { disable: true }
    depends_on: { api: { condition: service_healthy } }

  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: nova, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: nova }
    volumes: ["pgdata:/var/lib/postgresql/data", "../docker/postgres/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nova -d nova"], interval: 5s, timeout: 3s, retries: 30 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 30 }
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment: { MINIO_ROOT_USER: "${S3_ACCESS_KEY:?}", MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?}" }
    volumes: ["miniodata:/data"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 30 }
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    env_file: .env.production
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
       mc mb -p local/$$S3_BUCKET && mc anonymous set none local/$$S3_BUCKET &&
       mc version enable local/$$S3_BUCKET"
    restart: "no"

  # Code execution (optional): needs gVisor (runsc) installed on the host — the runner refuses
  # runc in production. Enable with: --profile tools
  sandbox-runner:
    profiles: ["tools"]
    image: ${REGISTRY:-nova}/nova-sandbox-runner:${IMAGE_TAG:-dev}
    environment:
      APP_ENV: production
      SANDBOX_RUNTIME: runsc
      SANDBOX_IMAGE: ${REGISTRY:-nova}/nova-sandbox-python:${IMAGE_TAG:-dev}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?}
    user: "0:0"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]  # dedicated host only (docs/24 §8)
    restart: unless-stopped

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, caddy_data: {}, caddy_config: {} }
