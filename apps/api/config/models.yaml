# NOVA AI model registry (docs/15_MODEL_CONFIGURATION.md).
# Groq model IDs come from env vars; set them from current Groq documentation.
# Values left as null must be filled from Groq docs (or are adopted from Groq's models list
# where Groq reports them). The API refuses to serve chat until required values are present.
version: 1

defaults:
  model_key: primary
  purposes:
    chat: primary
    title: primary
    summary: primary
    memory_extraction: primary
    query_rewrite: primary
    eval_judge: primary

models:
  # openai/gpt-oss-120b — facts verified against console.groq.com/docs/model/openai/gpt-oss-120b
  # on 2026-09-24. If GROQ_DEFAULT_MODEL points at another model, update these facts too.
  - key: primary
    groq_model_id: ${GROQ_DEFAULT_MODEL:-openai/gpt-oss-120b}
    display_name: "Nova"
    description: "GPT-OSS 120B on Groq, running on your own Groq API key."
    enabled: true
    context_window: 131072
    max_output_tokens: 65536
    default_max_output_tokens: 4096
    default_temperature: 0.7
    default_top_p: 1.0
    supports_streaming: true
    supports_tools: true
    supports_parallel_tool_calls: false
    supports_json_mode: true
    supports_vision: false
    fallback_key: null
    plans: [free, plus, pro]
    pricing: { input_per_million_usd: 0.15, output_per_million_usd: 0.60 }

  - key: fast
    groq_model_id: ${GROQ_FAST_MODEL:-}   # optional second model; disabled when unset
    display_name: "Nova Fast"
    description: "Fastest responses for simple tasks."
    enabled: true
    context_window: null
    max_output_tokens: null
    default_max_output_tokens: 1024
    default_temperature: 0.7
    default_top_p: 1.0
    supports_streaming: true
    supports_tools: null
    supports_parallel_tool_calls: false
    supports_json_mode: null
    supports_vision: false
    fallback_key: null
    plans: [free, plus, pro]
    pricing: { input_per_million_usd: null, output_per_million_usd: null }

  # qwen/qwen3.8-27b — facts verified against console.groq.com/docs/model/qwen/qwen3.8-27b and
  # /docs/vision on 2026-09-24 (3 images/request, 20 MB, 2,048 tokens/image); pricing from
  # console.groq.com/docs/models. Used automatically when a message has images.
  - key: vision
    groq_model_id: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
    display_name: "Nova Vision"
    description: "Reads screenshots, photos and diagrams."
    enabled: true
    context_window: 131072
    max_output_tokens: 16384
    default_max_output_tokens: 4096
    default_temperature: 0.3
    default_top_p: 1.0
    supports_streaming: true
    supports_tools: true
    supports_parallel_tool_calls: false
    supports_json_mode: true
    supports_vision: true
    max_images_per_request: 3
    fallback_key: null
    plans: [free, plus, pro]   # BYOK: the user's own Groq key pays for vision calls
    pricing: { input_per_million_usd: 0.80, output_per_million_usd: 4.00 }
