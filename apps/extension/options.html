<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nova Quick Chat — Settings</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 520px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
      label { display: block; font-weight: 600; margin: 16px 0 6px; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit; border-radius: 8px; border: 1px solid #8884; }
      button { margin-top: 12px; padding: 8px 14px; font: inherit; border-radius: 8px; border: 0; background: #5b5bd6; color: #fff; cursor: pointer; }
      .muted { opacity: 0.7; font-size: 14px; }
      kbd { border: 1px solid #8886; border-radius: 4px; padding: 0 5px; font-size: 13px; }
      #status { margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1>Nova Quick Chat</h1>
    <p class="muted">
      Press <kbd id="shortcut">Ctrl+Shift+1</kbd> (or click the toolbar icon) to open a small floating Nova chat.
      Drag it anywhere; it stays open after you close the Nova tab. Change the shortcut at
      <code>chrome://extensions/shortcuts</code>.
    </p>
    <form id="form">
      <label for="baseUrl">Nova address</label>
      <input id="baseUrl" type="url" required placeholder="http://localhost:3000" />
      <p class="muted">Sign in to Nova in this browser first; the window uses your normal Nova session.</p>
      <button type="submit">Save</button><span id="status" role="status"></span>
    </form>
    <script src="options.js"></script>
  </body>
</html>
