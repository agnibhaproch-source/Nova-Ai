<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Nova settings</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 20px; line-height: 1.5; }
      label { font-weight: 600; display: block; margin-bottom: 6px; }
      input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border-radius: 8px; border: 1px solid #8886; }
      button { margin-top: 10px; padding: 7px 14px; border: 0; border-radius: 8px; background: #5b5bd6; color: #fff; font: inherit; }
      .muted { opacity: 0.7; font-size: 13px; }
      kbd { border: 1px solid #8886; border-radius: 4px; padding: 0 5px; }
    </style>
  </head>
  <body>
    <form id="f">
      <label for="url">Nova address</label>
      <input id="url" type="url" required />
      <button type="submit">Save</button> <span id="status" class="muted" role="status"></span>
    </form>
    <p class="muted">Shortcuts: <kbd id="t"></kbd> show/hide Quick Chat · <kbd id="s"></kbd> screenshot into Quick Chat. All other settings (opacity, memory, account…) are in Quick Chat → ⚙.</p>
    <script src="settings.js"></script>
  </body>
</html>
